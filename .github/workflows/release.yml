name: Build & Publish Windows Release (Beta & Stable)

on:
  push:
    branches:
      - beta
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Channel & Version from pubspec.yaml
        id: meta
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)'
          $baseVer = $line.Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -eq "main") {
            $channel = "stable"
            $version = $baseVer
            $isPrerelease = "false"
          } else {
            $channel = "beta"
            $version = "$baseVer-beta.${{ github.run_number }}"
            $isPrerelease = "true"
          }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies & run tests
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Windows Native Release
        run: |
          flutter build windows --release `
            --dart-define=APP_ENV=${{ steps.meta.outputs.channel }} `
            --dart-define=APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Bundle VC++ Runtime DLLs
        shell: pwsh
        run: |
          $sys32 = "$env:SystemRoot\System32"
          $dest = "build\windows\x64\runner\Release"
          Copy-Item "$sys32\vcruntime140.dll" $dest -Force
          Copy-Item "$sys32\vcruntime140_1.dll" $dest -Force
          Copy-Item "$sys32\msvcp140.dll" $dest -Force

      - name: Smoke test — launch on real Windows, verify alive + window visible
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release"
          $exe = Get-ChildItem "$dest\*.exe" | Select-Object -First 1
          Write-Host "Launching $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 12
          $crashed = $p.HasExited
          if ($crashed) {
            Write-Host "::error::App exited on startup (exit code $($p.ExitCode))"
          } else {
            Write-Host "App alive after 12s (PID $($p.Id))"
          }
          # Screenshot BEFORE killing the app, so the artifact shows the window.
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\window_screenshot.png")
            Write-Host "Screenshot saved"
          } catch { Write-Host "Screenshot capture failed (non-fatal): $_" }
          if (-not $crashed) { Stop-Process $p -Force }
          # App-level crash log (Dart-side failures write checkpoints here).
          $log = Get-ChildItem $env:APPDATA -Recurse -Depth 8 -Filter "tabaro3_crash.log" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) {
            Write-Host "--- tabaro3_crash.log ---"
            Get-Content $log.FullName
            Copy-Item $log.FullName .\crash_log.txt -Force
          }
          # OS-level crash events catch DLL load failures that kill the process
          # before Dart code (and the crash log) can run.
          Get-WinEvent -FilterHashtable @{
            LogName='Application'; ProviderName='Application Error';
            StartTime=(Get-Date).AddMinutes(-2)
          } -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "EVENT LOG: $($_.Message)"
          }
          if ($crashed) { exit 1 }
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: |
            window_screenshot.png
            crash_log.txt
          if-no-files-found: ignore

      - name: Compile Inno Setup (.exe) Installer
        run: |
          iscc `
            "/DAppChannel=${{ steps.meta.outputs.channel }}" `
            "/DAppVersion=${{ steps.meta.outputs.version }}" `
            installer/tabaro3_setif.iss

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Tabaro3 Sétif ${{ steps.meta.outputs.tag }} (${{ steps.meta.outputs.channel }})"
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            build/installer/*.exe
